name: One-time privacy cleanup

on:
  push:
    branches:
      - main

permissions:
  actions: write

jobs:
  delete-old-run:
    runs-on: ubuntu-22.04
    steps:
      - name: Delete workflow run referencing replaced history
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/runs/35411572952"
